name: InputMesh CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inputmesh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-core-linux:
    name: Swift core · Linux
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift toolchain
        run: swift --version
      - name: Validate Workspace Handoff copy
        run: bash ./scripts/check-workspace-product-copy.sh
      - name: Compile core and cross-platform contracts
        run: swift build
      - name: Unit tests
        run: swift test --parallel
      - name: End-to-end local Git handoff smoke
        run: ./scripts/test-workspace-handoff.sh
      - name: Optimized build
        run: swift build -c release

  macos:
    name: Native macOS · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify host toolchain and architecture
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Compile native app and library targets
        run: swift build --product InputMeshDesktop
      - name: Unit tests on macOS
        run: swift test --parallel
      - name: End-to-end local Git handoff smoke
        run: ./scripts/test-workspace-handoff.sh
      - name: Package and verify native app (ad-hoc preview)
        run: |
          ./scripts/build-macos-app.sh
          ./scripts/verify-macos-app.sh "dist/InputMesh.app" "${{ matrix.arch }}"
      - name: Upload macOS preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputMesh-macOS-${{ matrix.arch }}-preview
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish-diagnostic-preview:
    name: Publish clearly labeled macOS preview (NOT production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [swift-core-linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: InputMesh-macOS-*-preview
          path: dist
          merge-multiple: true
      - name: Verify both architectures and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/InputMesh-0.3.0-macos-arm64-preview.zip
          test -f dist/InputMesh-0.3.0-macos-x86_64-preview.zip
          cd dist
          for sum in *.sha256; do shasum -a 256 -c "$sum"; done
      - name: Publish pre-release with explicit warnings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="v0.2.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" dist/*.zip dist/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease --latest=false \
            --title "InputMesh $VERSION · local workspace diagnostic PREVIEW" \
            --notes-file docs/preview-release-notes.md
